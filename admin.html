<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Отзывы — ELEKTRON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
</head>
<body class="admin-page">

  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow--1"></div>

  <main class="admin">
    <div class="container admin__container">

      <header class="admin__header">
        <a href="index.html" class="admin__back">← На сайт</a>
        <h1>Отзывы на сайте</h1>
        <p class="admin__subtitle">Просто: вставил → опубликовал → видно всем</p>
      </header>

      <section class="admin__panel" id="admin-login">
        <h2>Вход</h2>
        <p class="admin__hint">PIN: <strong>472891</strong> (не GitHub token!)</p>
        <form class="admin__form" id="login-form">
          <label class="reviews__field">
            <span>PIN-код</span>
            <input type="password" id="admin-pin" required inputmode="numeric" maxlength="12" placeholder="472891">
          </label>
          <button type="submit" class="btn btn--primary admin__btn">Войти</button>
          <p class="admin__error" id="login-error" hidden></p>
        </form>
      </section>

      <section class="admin__panel" id="admin-dashboard" hidden>
        <div class="admin__toolbar">
          <div>
            <p class="admin__count" id="site-review-count">На сайте: …</p>
          </div>
          <div class="admin__toolbar-actions">
            <button type="button" class="btn btn--sm" id="refresh-btn">Обновить</button>
            <button type="button" class="btn btn--sm" id="logout-btn">Выйти</button>
          </div>
        </div>

        <div class="admin__list" id="admin-list"></div>
        <p class="admin__empty" id="admin-empty" hidden>Нет отзывов</p>

        <div class="admin__manual" id="admin-manual">
          <h3>Опубликовать отзыв</h3>
          <p class="admin__hint">Скопируй из email → вставь → Опубликовать</p>
          <form class="admin__form" id="manual-form">
            <label class="reviews__field">
              <span>Имя</span>
              <input type="text" id="manual-name" required maxlength="60">
            </label>
            <label class="reviews__field">
              <span>Оценка 1–5</span>
              <input type="number" id="manual-rating" min="1" max="5" value="5" required>
            </label>
            <label class="reviews__field">
              <span>Текст</span>
              <textarea id="manual-text" required maxlength="500" rows="3"></textarea>
            </label>
            <button type="submit" class="btn btn--primary admin__btn">Опубликовать на сайте</button>
          </form>

          <hr style="margin:1.5rem 0;border:none;border-top:1px solid rgba(255,255,255,.1)">

          <p class="admin__hint"><strong>GitHub token</strong> (один раз, для автопубликации)</p>
          <label class="reviews__field">
            <span>Token ghp_...</span>
            <input type="password" id="github-token" autocomplete="off" placeholder="ghp_..." spellcheck="false">
          </label>
          <button type="button" class="btn btn--sm btn--primary" id="github-sync-btn">Сохранить token</button>
          <p class="admin__hint admin__hint--small" id="github-status"></p>
          <button type="button" class="btn btn--sm" id="github-edit-btn">Или вставить вручную на GitHub</button>
        </div>
      </section>

    </div>
  </main>

  <script src="js/config.js?v=12"></script>
  <script src="js/site-reviews-store.js?v=12"></script>
  <script src="js/admin.js?v=12"></script>
</body>
</html>
